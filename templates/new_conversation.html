{% extends "base.html" %}
{% block title %}New Conversation · Inbox{% endblock %}
{% block content %}
  <section class="card">
    <h2>Start a Conversation</h2>

    <form class="form" method="POST">
      <label>Subject (optional)</label>
      <input name="subject" placeholder="Collab idea…">

      <label>Participant A *</label>
      <input name="participant_a" placeholder="Bee" required>

      <label>Participant B *</label>
      <input name="participant_b" placeholder="Rod" required>

      <label>First message sender *</label>
      <input name="first_sender" placeholder="Bee" required>

      <label>First message *</label>
      <textarea name="first_body" rows="4" required></textarea>

      <button class="btn primary" type="submit">Create</button>
    </form>
  </section>
{% endblock %}
