{% extends "base.html" %}

{% block title %}Performance Shared • Find the Beat{% endblock %}

{% block content %}
<style>
  .share-confirm {
    min-height: calc(100vh - 172px);
    margin: -1rem -0.9rem 0;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: linear-gradient(180deg, #fbf4de 0%, #eee7d0 100%);
    text-align: center;
  }

  .share-card {
    display: grid;
    gap: 0.8rem;
    width: min(100%, 360px);
    padding: 1.25rem;
    border-radius: 0 0 28px 28px;
    background: rgba(255, 250, 238, 0.82);
    box-shadow: 0 10px 0 rgba(47, 30, 13, 0.1), 0 16px 24px rgba(47, 30, 13, 0.16);
  }

  .share-icon {
    font-size: 4rem;
    line-height: 1;
  }

  .share-card h1 {
    margin: 0;
    color: rgba(47, 30, 13, 0.78);
    font-size: clamp(2rem, 9vw, 3rem);
    font-weight: 300;
    line-height: 1;
  }

  .share-card p {
    margin: 0;
    color: rgba(47, 30, 13, 0.64);
  }
</style>

<section class="share-confirm">
  <div class="share-card">
    <div class="share-icon">✦</div>
    <h1>Thank you for sharing {{ perf.profile.display_name if perf.profile else "this artist" }}’s performance.</h1>
    <p>{{ perf.title }}</p>
    <a class="button primary" href="{{ url_for('performance_detail', perf_id=perf.id) }}">Back to Performance</a>
    <a class="button secondary" href="{{ url_for('showcase') }}">Back to Showcases</a>
  </div>
</section>
{% endblock %}
