{% extends "base.html" %}
{% block title %}Upload Performance • Find the Beat{% endblock %}
{% block content %}
<h1>Upload Performance</h1>

<form method="post" enctype="multipart/form-data" class="form">
  <label>Title</label>
  <input name="title" placeholder="Performance title" required>

  <label>Description</label>
  <textarea name="description" rows="4" placeholder="Tell us about it…"></textarea>

  <label>Attach to profile</label>
  <select name="profile_id" required>
    <option value="">Choose…</option>
    {% for p in profiles %}
      <option value="{{ p.id }}">{{ p.display_name }} ({{ p.role }})</option>
    {% endfor %}
  </select>

  <label>Video (optional)</label>
  <input type="file" name="video" accept=".mp4,.mov,.m4v,.webm">

  <label>Thumbnail (optional)</label>
  <input type="file" name="thumb" accept=".jpg,.jpeg,.png,.webp">

  <button type="submit">Upload</button>
</form>
{% endblock %}
