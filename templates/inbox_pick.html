{% extends "base.html" %}
{% block title %}Pick Profile{% endblock %}

{% block content %}
  <h2>Inbox</h2>
  <p>Select who you are (MVP). Later we’ll replace this with real login.</p>

  <div class="grid">
    {% for p in profiles %}
      <a class="card" href="{{ url_for('inbox', profile_id=p.id) }}">
        <strong>{{ p.name }}</strong>
        <div class="muted">{{ p.role }}</div>
      </a>
    {% endfor %}
  </div>

  <div style="margin-top:16px;">
    <a class="btn" href="{{ url_for('new_message') }}">Compose Message</a>
  </div>
{% endblock %}
