{% extends "base.html" %}

{% block title %}New Message | Find the Beat{% endblock %}

{% block content %}
<section class="page-card" style="max-width:760px; margin:0 auto; padding:2rem;">
  <h1 style="margin-top:0;">New Message</h1>

  {% if recipient %}
    <p style="color:var(--muted);">Send a message to <strong>{{ recipient.display_name }}</strong>.</p>
  {% endif %}

  <form method="POST" style="display:grid; gap:1rem;">
    {% if not recipient %}
      <label>
        <strong>Recipient</strong>
        <select name="recipient_id" required style="width:100%; min-height:52px; border-radius:16px; border:1px solid var(--line); padding:0 1rem; font:inherit;">
          <option value="">Choose recipient</option>
          {% for p in recipients %}
            {% if user and p.id != user.id %}
              <option value="{{ p.id }}">{{ p.display_name }} — {{ p.role or "Creative" }}</option>
            {% endif %}
          {% endfor %}
        </select>
      </label>
    {% endif %}

    <label>
      <strong>Message</strong>
      <textarea name="body" placeholder="Write your message here..." required style="width:100%; min-height:150px; border-radius:16px; border:1px solid var(--line); padding:1rem; font:inherit;"></textarea>
    </label>

    <div>
      <button class="button primary" type="submit">Send Message</button>
      <a class="button secondary" href="{{ url_for('profiles') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
