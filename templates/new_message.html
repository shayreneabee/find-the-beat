{% extends "base.html" %}

{% block title %}New Message{% endblock %}

{% block content %}
<style>
  .message-form {
    margin: 1rem;
    padding: 1rem;
  }

  .message-form label {
    display: block;
    margin-top: 0.8rem;
    text-align: center;
    color: var(--muted);
    font-size: 1.15rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .message-form select,
  .message-form textarea {
    width: 100%;
    border: 0;
    padding: 0.9rem;
    background: var(--cream);
    color: var(--text);
    box-shadow: inset 0 -1px 0 rgba(55, 31, 7, 0.14);
  }

  .message-form textarea {
    min-height: 170px;
    resize: vertical;
  }

  .message-actions {
    display: grid;
    gap: 0.8rem;
    margin-top: 1rem;
  }

  @media (min-width: 560px) {
    .message-form {
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
      padding: 1.25rem;
    }

    .message-actions {
      grid-template-columns: 1fr 1fr;
    }
  }
</style>

<div class="section-band">new message</div>

<section class="app-panel message-form">
  <form method="POST">
    <label for="recipient_id">To:</label>
    <select id="recipient_id" name="recipient_id" required>
      <option value="">Choose recipient</option>
      {% if selected_recipient %}
        <option value="{{ selected_recipient.id }}" selected>
          {{ selected_recipient.display_name }}{% if selected_recipient.role %} - {{ selected_recipient.role }}{% endif %}
        </option>
      {% endif %}
      {% for p in profiles %}
        {% if not selected_recipient or p.id != selected_recipient.id %}
          <option value="{{ p.id }}">{{ p.display_name }}{% if p.role %} - {{ p.role }}{% endif %}</option>
        {% endif %}
      {% endfor %}
    </select>

    <label for="body">Message:</label>
    <textarea
      id="body"
      name="body"
      placeholder="Write your message here..."
      required
    ></textarea>

    <div class="message-actions">
      <button class="button primary" type="submit">Send Message</button>
      <a class="button secondary" href="{{ url_for('inbox') }}">Back to Inbox</a>
    </div>
  </form>
</section>
{% endblock %}
