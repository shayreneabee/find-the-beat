{% extends "base.html" %}
{% block title %}Upload Performance • Find the Beat{% endblock %}
{% block content %}
  <div class="card">
    <h2>Upload Performance</h2>

    <form method="POST" enctype="multipart/form-data" class="form">
      <label>Title
        <input name="title" required />
      </label>

      <label>Description
        <textarea name="description" rows="3"></textarea>
      </label>

      <label>Attach to Profile (optional)
        <select name="profile_id">
          <option value="">None</option>
          {% for p in profiles %}
            <option value="{{ p.id }}">{{ p.name }} — {{ p.role }}</option>
          {% endfor %}
        </select>
      </label>

      <div class="grid2">
        <label>Video (required)
          <input type="file" name="video" accept=".mp4,.mov,.m4v,.webm" required />
        </label>
        <label>Thumbnail (optional)
          <input type="file" name="thumb" accept=".jpg,.jpeg,.png,.webp" />
        </label>
      </div>

      <button class="btn primary" type="submit">Upload</button>
    </form>
  </div>
{% endblock %}
