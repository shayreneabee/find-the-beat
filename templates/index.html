{% extends "base.html" %}

{% block title %}Find the Beat{% endblock %}

{% block content %}
<style>
  .welcome-hero {
    margin-top: 6.2rem;
    background: var(--accent);
    padding: 1.6rem 1.25rem 1.8rem;
    text-align: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
  }

  .welcome-icon {
    width: 112px;
    height: 88px;
    margin: 0 auto 0.75rem;
    display: grid;
    place-items: center;
    border: 8px solid var(--text);
    border-radius: 9px;
    font-size: 4rem;
    line-height: 1;
  }

  .welcome-hero h1 {
    margin: 0;
    font-size: clamp(2rem, 10vw, 3rem);
    line-height: 0.95;
    letter-spacing: 0.06em;
    text-transform: lowercase;
    font-weight: 400;
  }

  .home-actions {
    display: grid;
    gap: 0.85rem;
    padding: 2rem 1.5rem 1rem;
  }

  .home-actions .button {
    width: 100%;
    font-size: 1.35rem;
    letter-spacing: 0.04em;
    text-transform: lowercase;
  }

  .quick-search {
    padding: 1rem;
  }

  .quick-search form {
    display: grid;
    gap: 0.7rem;
  }

  .quick-search input {
    width: 100%;
    min-height: 52px;
    border: 0;
    border-radius: 0;
    padding: 0 1rem;
    background: var(--cream);
    color: var(--text);
    box-shadow: inset 0 -1px 0 rgba(55, 31, 7, 0.14);
    font-size: 1rem;
  }

  .home-section-title {
    text-align: center;
    margin: 1.2rem 0 0.1rem;
    color: var(--text);
    font-size: 1.55rem;
    letter-spacing: 0.05em;
    font-weight: 400;
    text-transform: uppercase;
  }

  @media (min-width: 560px) {
    .welcome-hero {
      margin-top: 0;
      min-height: 360px;
      display: grid;
      place-items: center;
      border-radius: 0 0 22px 22px;
    }

    .welcome-icon {
      width: 128px;
      height: 96px;
    }

    .welcome-hero h1 {
      font-size: clamp(3rem, 5.4vw, 5rem);
    }

    .home-actions {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 640px;
      margin: 0 auto;
    }

    .quick-search {
      max-width: 760px;
      margin: 0 auto;
    }

    .quick-search form {
      grid-template-columns: 1fr auto;
    }

    .tile-grid .image-tile[style] {
      grid-column: auto !important;
      width: auto !important;
      justify-self: stretch !important;
    }
  }
</style>

<section class="welcome-hero">
  <div class="welcome-icon">♪</div>
  <h1>welcome<br>to<br>find the beat</h1>
</section>

<div class="home-actions">
  {% if user %}
    <a href="{{ url_for('profile') }}" class="button primary">my profile</a>
    <a href="{{ url_for('upload_performance') }}" class="button secondary">upload performance</a>
  {% else %}
    <a href="{{ url_for('login') }}" class="button primary">sign-in</a>
    <a href="{{ url_for('signup') }}" class="button secondary">create profile</a>
  {% endif %}
</div>

<section class="app-panel quick-search">
  <form method="GET" action="{{ url_for('search') }}">
    <input name="q" placeholder="email address, artist, role, or city">
    <button class="button primary" type="submit">search</button>
  </form>
</section>

<h2 class="home-section-title">I’m looking for:</h2>
<div class="tile-grid">
  <a class="image-tile" href="{{ url_for('production') }}">
    <img src="{{ url_for('static', filename='mockup_tiles/production.png') }}" alt="Production">
    <span>Production</span>
  </a>
  <a class="image-tile" href="{{ url_for('composers') }}">
    <img src="{{ url_for('static', filename='mockup_tiles/composers.png') }}" alt="Composers">
    <span>Composers</span>
  </a>
  <a class="image-tile" href="{{ url_for('artists') }}">
    <img src="{{ url_for('static', filename='mockup_tiles/artists.png') }}" alt="Artists">
    <span>Artist</span>
  </a>
  <a class="image-tile" href="{{ url_for('musicians') }}">
    <img src="{{ url_for('static', filename='mockup_tiles/musicians.png') }}" alt="Musicians">
    <span>Musicians</span>
  </a>
  <a class="image-tile" href="{{ url_for('performances') }}" style="grid-column:1 / -1; width:72%; justify-self:center;">
    <img src="{{ url_for('static', filename='mockup_tiles/showcases.png') }}" alt="Showcases">
    <span>Showcases</span>
  </a>
</div>
{% endblock %}
