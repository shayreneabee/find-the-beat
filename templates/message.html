{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Send a Message</h2>
  <p class="muted">To: {{ profile.name }} ({{ profile.role }})</p>

  <form method="post" class="form">
    <label>Your name</label>
    <input name="from_name" required>

    <label>Your role (optional)</label>
    <input name="from_role" placeholder="Producer / Artist / Manager">

    <label>Message</label>
    <textarea name="body" rows="5" required></textarea>

    <button class="btn gold" type="submit">Send</button>
    <a class="btn" href="{{ url_for('profile_detail', profile_id=profile.id) }}">Back</a>
  </form>
</section>
{% endblock %}
