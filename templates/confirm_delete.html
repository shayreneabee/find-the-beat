{% extends "base.html" %}
{% block title %}Delete Profile • Find the Beat{% endblock %}

{% block content %}
  <div class="card">
    <h2>Delete Profile</h2>
    <p>Are you sure you want to delete <strong>{{ profile.name }}</strong>?</p>

    <form method="POST">
      <button class="btn danger" type="submit">Yes, delete</button>
      <a class="btn" href="/profiles/{{ profile.id }}">Cancel</a>
    </form>
  </div>
{% endblock %}
