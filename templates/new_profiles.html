{% extends "base.html" %}
{% block title %}Create Profile • Find the Beat{% endblock %}

{% block content %}
  <div class="card">
    <h2>Create Profile</h2>
    <p class="muted">Keep it simple. You can improve it later.</p>

    <form class="form" method="POST" enctype="multipart/form-data">
      <label>Name / Stage name</label>
      <input name="name" required>

      <label>City</label>
      <input name="city" placeholder="Dallas, TX" required>

      <label>Role</label>
      <select name="role" required>
        <option value="Artist">Artist</option>
        <option value="Musician">Musician</option>
        <option value="Production">Production</option>
        <option value="Composer">Composer</option>
      </select>

      <label>Instrument (optional)</label>
      <input name="instrument" placeholder="Guitar, Piano, Drums…">

      <label>Bio (optional)</label>
      <textarea name="bio" rows="4" placeholder="What kind of music do you make? What are you looking for?"></textarea>

      <label>Profile photo (optional)</label>
      <input type="file" name="photo" accept="image/*">

      <button class="btn primary" type="submit">Create Profile</button>
    </form>
  </div>
{% endblock %}
