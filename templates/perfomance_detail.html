{% extends "base.html" %}
{% block content %}
  <h2>{{ perf.title }}</h2>
  <p class="muted">
    {% if perf.profile %}{{ perf.profile.name }} • {% endif %}
    {{ perf.created_at.strftime("%b %d, %Y") }}
  </p>

  {% if perf.description %}
    <p>{{ perf.description }}</p>
  {% endif %}

  {% if perf.video_filename %}
    <video class="video" controls>
      <source src="{{ url_for('static', filename='uploads/videos/' ~ perf.video_filename) }}">
      Your browser does not support video.
    </video>
  {% endif %}

  <form method="POST" action="{{ url_for('like_performance', perf_id=perf.id) }}" class="likebar">
    <input name="liker_tag" placeholder="your tag (optional)">
    <button class="btn" type="submit">💛 Like ({{ like_count }})</button>
  </form>
{% endblock %}
