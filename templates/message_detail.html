{% extends "base.html" %}
{% block title %}Message{% endblock %}

{% block content %}
  <h2>{{ msg.subject or "(no subject)" }}</h2>
  <p class="muted">From: {{ msg.sender.name }} → To: {{ msg.recipient.name }}</p>
  <p class="muted">{{ msg.created_at.strftime("%b %d, %Y %I:%M%p") }}</p>

  <div class="card">
    <p style="white-space: pre-wrap;">{{ msg.body }}</p>
  </div>

  <div style="margin-top: 16px;">
    <a class="btn" href="{{ url_for('inbox', profile_id=msg.recipient.id) }}">Back to Inbox</a>
  </div>
{% endblock %}
