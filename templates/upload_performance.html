{% extends "base.html" %}

{% block title %}Upload Performance | Find the Beat{% endblock %}

{% block content %}
<section class="page-card" style="max-width:760px; margin:0 auto; padding:2rem;">
  <h1 style="margin-top:0;">Upload Performance</h1>
  <p style="color:var(--muted);">Add a video or clip to your public profile.</p>

  <form method="POST" enctype="multipart/form-data" style="display:grid; gap:1rem;">
    <label>
      <strong>Title</strong>
      <input type="text" name="title" required style="width:100%; min-height:52px; border-radius:16px; border:1px solid var(--line); padding:0 1rem; font:inherit;">
    </label>

    <label>
      <strong>Description</strong>
      <textarea name="description" placeholder="Tell us about this performance..." style="width:100%; min-height:120px; border-radius:16px; border:1px solid var(--line); padding:1rem; font:inherit;"></textarea>
    </label>

    <label>
      <strong>Performance Video</strong>
      <input type="file" name="video" accept=".mp4,.mov,.m4v,.webm">
    </label>

    <label>
      <strong>Thumbnail Image</strong>
      <input type="file" name="thumb" accept=".jpg,.jpeg,.png,.gif,.webp">
    </label>

    <div>
      <button class="button primary" type="submit">Upload Performance</button>
      <a class="button secondary" href="{{ url_for('profile') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
