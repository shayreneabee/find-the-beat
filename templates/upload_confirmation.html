{% extends "base.html" %}
{% block content %}
<div class="ftb-screen">
  <div class="ftb-topbar">
    <div class="ftb-brand">FINDTHEBEAT<span class="note">♪</span></div>
  </div>

  <div class="ftb-page-title">SAVED</div>

  <div class="ftb-wrap">
    <div class="card">
      <h2>Performance added ✅</h2>
      <p><strong>{{ perf.title or "Performance" }}</strong></p>

      {% if perf.kind == "link" %}
        <p><a href="{{ perf.value }}" target="_blank" rel="noopener">Open Link</a></p>
      {% else %}
        <video controls style="width:100%; margin-top:10px;">
          <source src="{{ url_for('static', filename='uploads/' ~ perf.value) }}">
        </video>
      {% endif %}

      <div style="margin-top:16px;">
        <a class="btn" href="/profiles/{{ p.id }}?key={{ key }}">Back to Profile</a>
        <a class="btn secondary" href="/performances/upload?profile_id={{ p.id }}&key={{ key }}">Add Another</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
