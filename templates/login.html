{% extends "base.html" %}

{% block title %}Login | Find the Beat{% endblock %}

{% block content %}
<style>
  .login-hero {
    margin-top: 6.2rem;
    background: var(--accent);
    padding: 1.6rem 1.25rem 1.8rem;
    text-align: center;
  }

  .login-icon {
    width: 112px;
    height: 88px;
    margin: 0 auto 0.75rem;
    display: grid;
    place-items: center;
    border: 8px solid var(--text);
    border-radius: 9px;
    font-size: 4rem;
    line-height: 1;
  }

  .login-hero h1 {
    margin: 0;
    font-size: clamp(2rem, 10vw, 3rem);
    line-height: 0.95;
    letter-spacing: 0.06em;
    text-transform: lowercase;
    font-weight: 400;
  }

  .login-form {
    padding: 2rem 1rem 1rem;
    display: grid;
    gap: 0.8rem;
  }

  .login-form label {
    display: block;
    padding: 0.7rem 0.75rem 0.35rem;
    background: var(--accent);
    text-align: center;
    font-size: 1.25rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .login-form input {
    width: 100%;
    min-height: 50px;
    border: 0;
    padding: 0 1rem;
    background: var(--cream);
    box-shadow: inset 0 -1px 0 rgba(55, 31, 7, 0.14);
  }

  .login-actions {
    display: grid;
    gap: 0.8rem;
    padding: 1rem 4rem 0;
  }

  .login-note {
    margin: 0.2rem 0 0;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
  }

  @media (min-width: 560px) {
    .login-hero {
      margin-top: 0;
      border-radius: 0 0 22px 22px;
    }

    .login-actions {
      max-width: 520px;
      margin: 0 auto;
      grid-template-columns: 1fr 1fr;
      padding-left: 1rem;
      padding-right: 1rem;
    }
  }
</style>

<section class="login-hero">
  <div class="login-icon">♪</div>
  <h1>welcome<br>to<br>find the beat</h1>
</section>

<form method="POST" class="login-form">
  <div>
    <label for="email">Email Address:</label>
    <input id="email" name="email" type="email" required>
  </div>
  <div>
    <label for="password">Password:</label>
    <input id="password" name="password" type="password" required>
  </div>
  <div class="login-actions">
    <button type="submit" class="button primary">Sign-In</button>
    <a href="{{ url_for('signup') }}" class="button secondary">Create Profile</a>
  </div>
  <div class="oauth-prep" aria-label="Future social sign in">
    <button type="button" disabled>Continue with Google</button>
    <button type="button" disabled>Continue with Apple</button>
    <button type="button" disabled>Continue with Email</button>
    <button type="button" disabled>Facebook later</button>
  </div>
  <p class="login-note">Use the email and password from your Find the Beat profile.</p>
</form>
{% endblock %}
