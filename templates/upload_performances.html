{% extends "base.html" %}

{% block title %}Upload Performance{% endblock %}

{% block content %}
<section class="form-card">
    <h1>Upload Performance</h1>

    <form method="POST" enctype="multipart/form-data">
        <label>Title</label>
        <input type="text" name="title" required>

        <label>Description</label>
        <textarea name="description" placeholder="Tell us about this performance..."></textarea>

        <label>Artist Profile</label>
        <select name="profile_id" required>
            <option value="">Select an artist</option>
            {% for p in profiles %}
                <option value="{{ p.id }}">{{ p.display_name }} — {{ p.role }}</option>
            {% endfor %}
        </select>

        <label>Performance Video</label>
        <input type="file" name="video" accept=".mp4,.mov,.m4v,.webm">

        <label>Thumbnail Image</label>
        <input type="file" name="thumb" accept=".jpg,.jpeg,.png,.webp">

        <div style="margin-top:16px;">
            <button type="submit">Upload Performance</button>
        </div>
    </form>
</section>
{% endblock %}
