{% extends "base.html" %}
{% block title %}Profiles • Find the Beat{% endblock %}
{% block content %}
<h1>Profiles</h1>

{% if items %}
  <div class="grid2">
    {% for p in items %}
      <a class="profilecard" href="{{ url_for('profile_detail', profile_id=p.id) }}">
        <div class="pc-title">{{ p.display_name }}</div>
        <div class="pc-meta">{{ p.role }}</div>
      </a>
    {% endfor %}
  </div>
{% else %}
  <p class="muted">No profiles yet. Create one.</p>
{% endif %}
{% endblock %}
