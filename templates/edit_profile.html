{% extends "base.html" %}
{% block title %}Edit · {{ profile.name }}{% endblock %}
{% block content %}
  <section class="card">
    <h2>Edit Profile</h2>

    <form class="form" method="POST" enctype="multipart/form-data">
      <label>Name *</label>
      <input name="name" value="{{ profile.name }}" required>

      <label>City</label>
      <input name="city" value="{{ profile.city or '' }}">

      <label>Role</label>
      <input name="role" value="{{ profile.role or '' }}">

      <label>Instrument</label>
      <input name="instrument" value="{{ profile.instrument or '' }}">

      <label>Bio</label>
      <textarea name="bio" rows="4">{{ profile.bio or '' }}</textarea>

      <label>Replace Photo</label>
      <input type="file" name="photo" accept="image/*">

      <label>Replace Video</label>
      <input type="file" name="video" accept="video/*">

      <button class="btn primary" type="submit">Save Changes</button>
      <a class="btn" href="{{ url_for('profile_detail', profile_id=profile.id) }}">Cancel</a>
    </form>
  </section>
{% endblock %}
