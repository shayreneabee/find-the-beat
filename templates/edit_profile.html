{% extends "base.html" %}

{% block title %}Edit Profile | Find the Beat{% endblock %}

{% block content %}
<style>
  .form-card {
    max-width: 860px;
    margin: 0 auto;
    border-radius: 34px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    padding: 2rem;
  }

  .form-card h1 {
    font-size: clamp(2.4rem, 5vw, 4rem);
    line-height: 0.95;
    letter-spacing: -0.06em;
    margin: 0 0 0.7rem;
  }

  .form-card p {
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  .form-grid {
    display: grid;
    gap: 1rem;
  }

  .two {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }

  .field label {
    display: block;
    font-weight: 900;
    margin-bottom: 0.45rem;
  }

  .field input,
  .field textarea,
  .field select {
    width: 100%;
    min-height: 54px;
    border-radius: 18px;
    border: 1px solid var(--line);
    padding: 0 1rem;
    font-size: 1rem;
    outline: none;
    background: white;
    font-family: inherit;
  }

  .field textarea {
    min-height: 130px;
    padding-top: 0.9rem;
    resize: vertical;
  }

  @media (max-width: 760px) {
    .two {
      grid-template-columns: 1fr;
    }
  }
</style>

<section class="form-card">
  <h1>Edit your profile</h1>
  <p>Keep your creative info current so the right people can find you.</p>

  <form method="POST" enctype="multipart/form-data" class="form-grid">
    <div class="two">
      <div class="field">
        <label for="display_name">Display name</label>
        <input id="display_name" name="display_name" value="{{ profile.display_name or '' }}" required>
      </div>

      <div class="field">
        <label for="role">Role</label>
        <select id="role" name="role">
          {% set roles = ["artist", "producer", "musician", "composer", "engineer", "songwriter", "DJ", "vocalist", "manager"] %}
          <option value="">Choose a role</option>
          {% for role in roles %}
            <option value="{{ role }}" {% if profile.role == role %}selected{% endif %}>{{ role|title }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="two">
      <div class="field">
        <label for="genre">Genre</label>
        <input id="genre" name="genre" value="{{ profile.genre or '' }}" placeholder="R&B, hip-hop, gospel, jazz...">
      </div>

      <div class="field">
        <label for="city">City</label>
        <input id="city" name="city" value="{{ profile.city or '' }}">
      </div>
    </div>

    <div class="two">
      <div class="field">
        <label for="state">State</label>
        <input id="state" name="state" value="{{ profile.state or '' }}">
      </div>

      <div class="field">
        <label for="instrument">Instrument</label>
        <input id="instrument" name="instrument" value="{{ profile.instrument or '' }}">
      </div>
    </div>

    <div class="two">
      <div class="field">
        <label for="services_csv">Services</label>
        <input id="services_csv" name="services_csv" value="{{ profile.services_csv or '' }}" placeholder="mixing, hooks, beats">
      </div>

      <div class="field">
        <label for="tags_csv">Tags</label>
        <input id="tags_csv" name="tags_csv" value="{{ profile.tags_csv or '' }}" placeholder="live, studio, songwriter">
      </div>
    </div>

    <div class="field">
      <label for="bio">Bio</label>
      <textarea id="bio" name="bio">{{ profile.bio or '' }}</textarea>
    </div>

    <div class="two">
      <div class="field">
        <label for="profile_pic">Update profile picture</label>
        <input id="profile_pic" name="profile_pic" type="file" accept="image/*">
      </div>

      <div class="field">
        <label for="profile_video">Upload profile intro video</label>
        <input id="profile_video" name="profile_video" type="file" accept="video/mp4,video/quicktime,video/webm">
      </div>
    </div>

    <div>
      <button class="button primary" type="submit">Save Changes</button>
      <a href="{{ url_for('profile') }}" class="button secondary">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
