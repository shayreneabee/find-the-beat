{% extends "base.html" %}

{% block title %}Edit Profile | Find the Beat{% endblock %}

{% block content %}
<style>
  .form-card {
    max-width: 820px;
    margin: 0 auto;
    border-radius: 34px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    padding: 2rem;
  }

  .form-card h1 {
    font-size: clamp(2.4rem, 5vw, 4rem);
    line-height: 0.95;
    letter-spacing: -0.06em;
    margin: 0 0 0.7rem;
  }

  .form-card p {
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  .form-grid {
    display: grid;
    gap: 1rem;
  }

  .two {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }

  .field label {
    display: block;
    font-weight: 900;
    margin-bottom: 0.45rem;
  }

  .field input,
  .field textarea {
    width: 100%;
    min-height: 54px;
    border-radius: 18px;
    border: 1px solid var(--line);
    padding: 0 1rem;
    font-size: 1rem;
    outline: none;
    background: white;
    font-family: inherit;
  }

  .field textarea {
    min-height: 130px;
    padding-top: 0.9rem;
    resize: vertical;
  }

  .field input:focus,
  .field textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 5px rgba(228, 87, 46, 0.12);
  }

  @media (max-width: 760px) {
    .two {
      grid-template-columns: 1fr;
    }
  }
</style>

<section class="form-card">
  <h1>Edit your profile</h1>
  <p>Keep your creative info current so the right people can find you.</p>

  <form method="POST" enctype="multipart/form-data" class="form-grid">
    <div class="two">
      <div class="field">
        <label for="display_name">Display name</label>
        <input id="display_name" name="display_name" value="{{ user.display_name or '' }}" required>
      </div>

      <div class="field">
        <label for="role">Role</label>
        <input id="role" name="role" value="{{ user.role or '' }}">
      </div>
    </div>

    <div class="two">
      <div class="field">
        <label for="genre">Genre</label>
        <input id="genre" name="genre" value="{{ user.genre or '' }}">
      </div>

      <div class="field">
        <label for="city">City</label>
        <input id="city" name="city" value="{{ user.city or '' }}">
      </div>
    </div>

    <div class="two">
      <div class="field">
        <label for="instrument">Instrument</label>
        <input id="instrument" name="instrument" value="{{ user.instrument or '' }}">
      </div>

      <div class="field">
        <label for="services_csv">Services</label>
        <input id="services_csv" name="services_csv" value="{{ user.services_csv or '' }}">
      </div>
    </div>

    <div class="field">
      <label for="tags_csv">Tags</label>
      <input id="tags_csv" name="tags_csv" value="{{ user.tags_csv or '' }}">
    </div>

    <div class="field">
      <label for="bio">Bio</label>
      <textarea id="bio" name="bio">{{ user.bio or '' }}</textarea>
    </div>

    <div class="two">
      <div class="field">
        <label for="instagram_url">Instagram</label>
        <input id="instagram_url" name="instagram_url" type="url" value="{{ user.instagram_url or '' }}" placeholder="https://instagram.com/you">
      </div>
      <div class="field">
        <label for="tiktok_url">TikTok</label>
        <input id="tiktok_url" name="tiktok_url" type="url" value="{{ user.tiktok_url or '' }}" placeholder="https://tiktok.com/@you">
      </div>
    </div>

    <div class="two">
      <div class="field">
        <label for="youtube_url">YouTube</label>
        <input id="youtube_url" name="youtube_url" type="url" value="{{ user.youtube_url or '' }}" placeholder="https://youtube.com/@you">
      </div>
      <div class="field">
        <label for="spotify_url">Spotify</label>
        <input id="spotify_url" name="spotify_url" type="url" value="{{ user.spotify_url or '' }}" placeholder="https://open.spotify.com/...">
      </div>
    </div>

    <div class="field">
      <label for="linkedin_url">LinkedIn</label>
      <input id="linkedin_url" name="linkedin_url" type="url" value="{{ user.linkedin_url or '' }}" placeholder="https://linkedin.com/in/you">
    </div>

    <div class="field">
      <label for="profile_pic">Update profile picture</label>
      <input id="profile_pic" name="profile_pic" type="file" accept="image/*">
    </div>

<div class="field">
  <label for="profile_video">Upload profile video</label>
  <input id="profile_video" name="profile_video" type="file" accept="video/mp4,video/quicktime,video/webm">
</div>
    <div>
      <button class="button primary" type="submit">Save Changes</button>
      <a href="{{ url_for('profile') }}" class="button secondary">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
