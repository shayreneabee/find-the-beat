{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<section class="form-card">
    <h1>Edit Profile</h1>

    <form method="POST" enctype="multipart/form-data">
        <label>Display Name</label>
        <input type="text" name="display_name" value="{{ profile.display_name }}" required>

        <label>Role</label>
        <select name="role" required>
            <option value="Rapper" {% if profile.role == "Rapper" %}selected{% endif %}>Rapper</option>
            <option value="Singer" {% if profile.role == "Singer" %}selected{% endif %}>Singer</option>
            <option value="Producer" {% if profile.role == "Producer" %}selected{% endif %}>Producer</option>
            <option value="DJ" {% if profile.role == "DJ" %}selected{% endif %}>DJ</option>
            <option value="Engineer" {% if profile.role == "Engineer" %}selected{% endif %}>Engineer</option>
            <option value="Other" {% if profile.role == "Other" %}selected{% endif %}>Other</option>
        </select>

        <label>Replace Profile Photo</label>
        <input type="file" name="photo" accept=".jpg,.jpeg,.png,.webp">

        {% if profile.photo_filename %}
            <div style="margin-top:16px;">
                <img
                    class="media-frame"
                    src="{{ url_for('uploaded_photo', filename=profile.photo_filename) }}"
                    alt="{{ profile.display_name }}"
                    style="max-width:280px; height:auto;"
                >
            </div>
        {% endif %}

        <label>Bio</label>
        <textarea name="bio" placeholder="Tell people about this artist...">{{ profile.bio or "" }}</textarea>

        <div style="margin-top:16px;">
            <button type="submit">Save Changes</button>
        </div>
    </form>
</section>
{% endblock %}
