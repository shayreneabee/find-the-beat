services:
  - type: web
    name: find-the-beat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: find-the-beat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/find_the_beat_v2.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SECRET_KEY
        generateValue: true
